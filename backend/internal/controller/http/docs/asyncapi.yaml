asyncapi: 2.6.0
info:
  title: NexusChat WebSocket API
  version: 1.0.0

servers:
  local:
    url: ws://localhost:8004/api/v1/ws
    protocol: ws

channels:
  /api/v1/ws:
    bindings:
      ws:
        method: GET
    publish:
      message:
        oneOf:
          - $ref: '#/components/messages/AuthEnvelope'
          - $ref: '#/components/messages/ChatMessageEnvelope'
    subscribe:
      message:
        $ref: '#/components/messages/BroadcastMessage'

components:
  schemas:
    Envelope:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
        data:
          type: string
          description: JSON.stringify(payload)

    AuthPayload:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ChatMessagePayload:
      type: object
      required: [chat_id, text]
      properties:
        chat_id:
          type: integer
        text:
          type: string

    BroadcastMessage:
      type: object
      required: [message_id, user_id, username, usertag, chat_id, text, time]
      properties:
        message_id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        usertag:
          type: string
        chat_id:
          type: integer
        text:
          type: string
        time:
          type: string
          format: date-time

  messages:
    AuthEnvelope:
      messageId: auth
      name: auth
      title: auth
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - properties:
              type:
                const: auth
              data:
                description: AuthPayload

    ChatMessageEnvelope:
      messageId: chat_message
      name: chat_message
      title: chat_message
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - properties:
              type:
                const: chat_message
              data:
                description: ChatMessagePayload

    BroadcastMessage:
      messageId: broadcast
      name: broadcast
      title: broadcast
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BroadcastMessage'
