global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:8003"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]